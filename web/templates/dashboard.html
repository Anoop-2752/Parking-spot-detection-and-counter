<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parking Spot Detection</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0f172a;
            color: #e2e8f0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* ── Header ─────────────────────────────────── */
        .header {
            background: #1e293b;
            padding: 16px 32px;
            border-bottom: 1px solid #334155;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-shrink: 0;
        }

        .header h1 {
            font-size: 1.4rem;
            font-weight: 600;
            color: #f1f5f9;
        }

        .status-badge {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.85rem;
            color: #94a3b8;
        }

        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #22c55e;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        /* ── Main layout ────────────────────────────── */
        .dashboard {
            flex: 1;
            display: grid;
            grid-template-columns: 1fr 300px;
            grid-template-rows: 1fr auto;
            gap: 20px;
            padding: 20px 32px;
            max-width: 1440px;
            width: 100%;
            margin: 0 auto;
            min-height: 0;
        }

        /* ── Video ──────────────────────────────────── */
        .video-container {
            grid-row: 1 / 3;
            background: #1e293b;
            border-radius: 12px;
            border: 1px solid #334155;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 0;
        }

        .video-container img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
        }

        /* ── Stats grid (right side) ────────────────── */
        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .stat-card {
            background: #1e293b;
            border-radius: 12px;
            padding: 18px;
            border: 1px solid #334155;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .stat-card .label {
            font-size: 0.75rem;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            margin-bottom: 6px;
        }

        .stat-card .value {
            font-size: 2rem;
            font-weight: 700;
            line-height: 1;
        }

        .stat-card .subtitle {
            font-size: 0.7rem;
            color: #64748b;
            margin-top: 4px;
        }

        .stat-card.available .value { color: #22c55e; }
        .stat-card.occupied .value  { color: #ef4444; }
        .stat-card.total .value     { color: #3b82f6; }
        .stat-card.fps .value       { color: #eab308; }

        /* ── Occupancy bar ──────────────────────────── */
        .occupancy-bar {
            background: #1e293b;
            border-radius: 12px;
            padding: 18px;
            border: 1px solid #334155;
        }

        .occupancy-bar .label {
            font-size: 0.75rem;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            margin-bottom: 10px;
        }

        .bar-track {
            width: 100%;
            height: 12px;
            background: #334155;
            border-radius: 6px;
            overflow: hidden;
        }

        .bar-fill {
            height: 100%;
            border-radius: 6px;
            transition: width 0.5s ease, background 0.5s ease;
        }

        .bar-text {
            font-size: 0.75rem;
            color: #94a3b8;
            margin-top: 6px;
            text-align: right;
        }

        /* ── Responsive ─────────────────────────────── */
        @media (max-width: 960px) {
            .dashboard {
                grid-template-columns: 1fr;
                grid-template-rows: auto auto auto;
                padding: 16px;
            }

            .video-container {
                grid-row: auto;
                aspect-ratio: 16 / 9;
            }

            .stats-grid {
                grid-template-columns: repeat(4, 1fr);
            }

            .stat-card .value {
                font-size: 1.5rem;
            }
        }

        @media (max-width: 600px) {
            .stats-grid {
                grid-template-columns: 1fr 1fr;
            }

            .header {
                padding: 12px 16px;
            }

            .header h1 {
                font-size: 1.1rem;
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>Parking Spot Detection</h1>
        <div class="status-badge">
            <div class="status-dot"></div>
            Live Feed
        </div>
    </div>

    <div class="dashboard">
        <div class="video-container">
            <img src="/video_feed" alt="Live parking feed">
        </div>

        <div class="stats-grid">
            <div class="stat-card available">
                <div class="label">Available</div>
                <div class="value" id="available">--</div>
                <div class="subtitle">Empty spots</div>
            </div>

            <div class="stat-card occupied">
                <div class="label">Occupied</div>
                <div class="value" id="occupied">--</div>
                <div class="subtitle">Taken spots</div>
            </div>

            <div class="stat-card total">
                <div class="label">Total Spots</div>
                <div class="value" id="total">--</div>
                <div class="subtitle">All monitored</div>
            </div>

            <div class="stat-card fps">
                <div class="label">FPS</div>
                <div class="value" id="fps">--</div>
                <div class="subtitle">Processing speed</div>
            </div>
        </div>

        <div class="occupancy-bar">
            <div class="label">Occupancy</div>
            <div class="bar-track">
                <div class="bar-fill" id="bar-fill" style="width: 0%;"></div>
            </div>
            <div class="bar-text" id="bar-text">0%</div>
        </div>
    </div>

    <script>
        function updateStats() {
            fetch('/stats')
                .then(res => res.json())
                .then(data => {
                    document.getElementById('available').textContent = data.available;
                    document.getElementById('occupied').textContent = data.occupied;
                    document.getElementById('total').textContent = data.total;
                    document.getElementById('fps').textContent = data.fps;

                    const pct = data.total > 0
                        ? Math.round((data.occupied / data.total) * 100)
                        : 0;

                    const bar = document.getElementById('bar-fill');
                    bar.style.width = pct + '%';

                    if (pct < 50) {
                        bar.style.background = '#22c55e';
                    } else if (pct < 80) {
                        bar.style.background = '#eab308';
                    } else {
                        bar.style.background = '#ef4444';
                    }

                    document.getElementById('bar-text').textContent = pct + '% occupied';
                })
                .catch(() => {});
        }

        updateStats();
        setInterval(updateStats, 1500);
    </script>
</body>
</html>
